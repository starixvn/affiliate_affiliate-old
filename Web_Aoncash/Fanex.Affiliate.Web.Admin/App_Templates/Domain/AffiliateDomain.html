<script type="text/javascript">
    function NewWindow(HtmlName, WinName, ToolOptions) {
        window.open(HtmlName, WinName, ToolOptions);
    }
</script>

<div class="padl0">
    <div id="errMsg" style="display: none;" class="styleErrAddbanner">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    {submenu}
    <div style="margin: 10px 0px 0px 1px">
        <a href="javascript:DoCal('AddAffiliateDomain.aspx', 'Add AffDomain',340, 190);" class="abutton">
            <span>{AddAffDomain}</span> </a>
    </div>
    <div class="clear">
    </div>
    <div id="divContent" class="ContentBox" style="width: 860px;">
        <table width="100%" border="0" cellpadding="0" cellspacing="2">
            <tr>
                <td>
                    <div id="listuser" style="float: left;">
                        <table class="aff-table" cellspacing="1" cellpadding="3" border="0" style="width: 700px">
                            <tr>
                                <th style="width: 20px">
                                    &nbsp;
                                </th>
                                <th>
                                    {Domain}
                                </th>
                                <th style="width: 70px">
                                    {Creator}
                                </th>
                                <th>
                                    {CreatedDate}
                                </th>                              
                                <th>
                                    {Edit}
                                </th>
                                <th>
                                    {Del}
                                </th>
                            </tr>
                            <!--content-->
                            <tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                                <td class="c">
                                    {No_Value}
                                </td>
                                <td>
                                    {AffDomain_Value}
                                </td>                                
                                <td class="c">
                                    {Creator_Value}
                                </td>
                                <td class="c">
                                    {CreatedDate_Value}
                                </td>                           
                                <td style="text-align: center;">
                                    &nbsp;                                    
                                    <a class="icedit" href="javascript:DoCal('EditAffiliateDomain.aspx?affDomainID={affdomainid}&affDomainName={AffDomain_Value}', 'Edit AffDomain',340, 190);"
                                        style="cursor: pointer;" />                                    
                                </td>
                                <td style="text-align: center;">                                    
                                    <img border="0" src="../{themepath}/Images/delete.png" alt="Del" onclick="DelAffDomain({affdomainid},'{AffDomain_Value}');"
                                        style="cursor: pointer; text-align: center;" />                                    
                                </td>
                            </tr>
                            <!--/content-->
                        </table>
                        <div style="margin: 3px 0px 0px 1px">
                            <a href="javascript:DoCal('AddAffiliateDomain.aspx', 'Add AffDomain',340, 190);" class="abutton">
                                <span>{AddAffDomain}</span> </a>
                        </div>
                     </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div id="errMsg" style="display: none; margin-top: 10px; margin-bottom: -5px; width: 410px"
                        class="styleErrAddbanner">
                        <div id="error_item">
                            <ul>
                                <li><a class="err-msg" id="error_msg"></a></li>
                            </ul>
                        </div>
                    </div>                    
                </td>
            </tr>
        </table>
    </div>
</div>
</div>

<input type="hidden" id="cfmchoose" name="cfmchoose" value="{ChooseConfirm}" />
