<div class="hand c" style="overflow: auto; width: auto; height: auto;" >
    <!--ViewMode1-->
    <!--limit-fls-->
    <object height="{height}" width="{width}"codebase="http://download.macromedia.com/pub/shockwave/cabs/flash/swflash.cab#version=6,0,29,0"
        classid="clsid:D27CDB6E-AE6D-11cf-96B8-444553540000">
        <param value="{imagevalue}?id={version}" name="movie" />
        <param value="high" name="quality" />
        <param name="wmode" value="transparent" />
        <embed height="{height}" width="{width}" type="application/x-shockwave-flash" pluginspage="http://www.adobe.com/shockwave/download/download.cgi?P1_Prod_Version=ShockwaveFlash"
            wmode="transparent" quality="high" src="{imagevalue}?id={version}" />
    </object>
    <!--/limit-fls-->
    <!--limit-img-->
    <img id="img{bannerid}" src="{imagevalue}?id={version}"
        alt="" height="{height}" width="{width}"/>
    <!--/limit-img-->
    <!--/ViewMode1-->
</div>
