<script language="javascript">
     var minNo = {minNo};
     var maxNo = {maxNo};
</script>

<div class="padl0">
    <form method="post" name="frmSearch" id="frmSearch"
    target="upload_target" enctype="multipart/form-data" action="../Handler/UpdateBannerText.ashx">
    <div id="errMsg" style="display: none; width: 1100px;" class="styleErrAddText">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    {submenu}
    <div id="search_cont">
        <table cellpadding="2" cellspacing="1">
            <tr>
                <td>
                    {Category}
                </td>
                <td>
                    {optioncate}
                </td>
                <td>
                    {Language}
                </td>
                <td>
                    {optionlang}
                </td>
                <td>
                    {Currency}
                </td>
                <td>
                    {optioncurrency}
                </td>
                <td>
                    <div onclick="SubmitSearchForm();" id="divsearch">&nbsp;</div>
                </td>
            </tr>
        </table>
    </div>
    {paging-top}
    <table border="0" class="aff-table" cellpadding="0" cellspacing="1" style="width: 1200px;"
        id="tblResult">
        <tr>
            <th style="width: 8px;">&nbsp;</th>
            <th style="width: 8px;">&nbsp;</th>
            <th style="width: auto; font-weight: bold;">
                {Content}
            </th>
            <th style="width: 80px; font-weight: bold;">
                {Category}
            </th>
            <th style="width: 80px; font-weight: bold;">
                {Language}
            </th>
            <th style="width: 100px; font-weight: bold;">
                {Currency}
            </th>
            <th style="width: 40px; font-weight: bold;">
                {Action}
            </th>
        </tr>
        <tbody id="result">
            <!--Content-->
            <tr class="{rowstyle}" onmouseout="javascript:this.className='{rowstyle}';this.style.backgroundColor='';"
                onmouseover="this.style.backgroundColor='#fff5a5';" id="banner{textid}">
                <td>
                    <div class="chk ic-uncheck" id="{textid}">
                    </div>
                </td>
                <td class="c">
                    {order-val}
                </td>
                <td id="content{textid}">
                    <!--ViewMode1-->
                    {contentvalue}
                    <!--/ViewMode1-->
                    <!--UpdateMode1-->
                    <textarea id="textvalue" name="textvalue" style="width: 350px; height: 100px;">{contentvalue}</textarea>
                    <!--/UpdateMode1-->
                </td>
                <td id="category{textid}">
                    {catevalue}
                </td>
                <td id="langvalue{textid}">
                    {langvalue}
                </td>
                <td id="currency{textid}">
                    {currencyvalue}
                </td>
                <td style="text-align: center">
                    <!--ViewMode2-->
                    <a href="javascript:DoCal('AddText.aspx?editBannerID={textid}', 'Edit Text Banner', 460, 400);" id="edit{textid}"><span class="icedit">&nbsp;</span></a>                    
                    <!--/ViewMode2-->
                    <!--UpdateMode2-->
                    &nbsp;
                    <div>
                    <input id="btnupdate{textid}" type="submit" class="buttonlogin" value="Update" />
                    </div>
                    <div style="margin-top:10px; padding:5px 0px 5px 0px">
                    <input id="btncancel{textid}" type="button" class="buttonlogin" value="Cancel"
                        onclick="CancelEdit();" /></div>
                    <input type="hidden" id="hdBannerID" name="hdBannerID" value="{textid}" />
                    <!--/UpdateMode2-->
                </td>
            </tr>
            <!--/Content-->
        </tbody>
    </table>
    {paging-bottom}
    <div style="margin-top: 5px; height: 20px;" >
        <a href="javascript:DeleteSelectedText();" class="abutton" id="btnDelete">
            <span>{Delete}</span>
        </a>
        <a href="javascript:DoCal('AddText.aspx', 'Add Text', 460, 400);" class="abutton">
            <span>{Add}</span>
        </a>
    </div>
    <input type="hidden" id="page" name="page" value="{page-val}" />
    <input type="hidden" id="totalMedia" name="totalMedia" value="{totaltotalMedia-val}" />
    <input id="hdConfirmDelete" name="hdConfirmDelete" type="hidden" value="{ConfirmDeleteText}" />
    <input id="hdErrFileExtension" name="hdErrFileExtension" type="hidden" value="{ErrFileExtension}" />
    </form>
</div>
<iframe id="upload_target" name="upload_target" src="#" style="width: 0; height: 0; border: 0px solid #fff;"></iframe>
