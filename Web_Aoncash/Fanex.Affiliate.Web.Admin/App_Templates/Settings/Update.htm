    <style type="text/css">
        #addsetting
        {
            margin-left:10px;
        }
        .vrow
        {
            margin-bottom:10px;
        }
        .vrow .label
        {
            margin-bottom:4px;
        }
        #key, #rvalue, #description
        {
            width:550px;
        }
        #key, #type
        {
            height:24px;
        }
        #rvalue
        {
            height:300px;
        }
        #description
        {
            height:40px;
        }
    </style>
    <div id="addsetting">
        <div class="vrow">
            <div class="label">{Key}</div>
            <div class="input">
                <input id="key" type="text" disabled="disabled" value="{SName}" />
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Description}</div>
            <div class="input">
                <textarea id="description">{SDescription}</textarea>
            </div>
        </div>
        <div class="vrow">
            <div class="label">
                {Value}
            </div>
            <div class="input">
                <textarea id="rvalue">{SValue}</textarea>
            </div>
        </div>
        <div class="vrow">
            <a class="abutton" href="javascript:;" onclick="updateSetting();"><span id="Delete">{Update}</span></a>
            <a class="abutton" href="javascript:;" onclick="ClosePopupNoReload();"><span id="Span1">{Cancel}</span></a>
        </div>
    </div>

<script type="text/javascript">
    
    function updateSetting()
    {
        var value = encodeURIComponent($('rvalue').value);
        var description =  encodeURIComponent($('description').value);
                
        var ajax = new Ajax.Request("../Handler/SettingHandler.ashx", {
            method: 'post',
            parameters: "action=update&id={Id}&value=" + value + "&description=" + description,
            onComplete: function(data) {
                if(data.responseText == 'True')
                {
                    ClosePopup();
                }
                else
                {
                    alert(data.responseText);
                }
            }
        });
    }
</script>
