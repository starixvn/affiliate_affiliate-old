<style type="text/css">
    ::-moz-selection
    {
        background: #6374AB;
        color: #fff;
    }
    
    ::selection
    {
        background: #6374AB;
        color: #fff;
    }
    select
    {
        width: 200px;
    }
    #slPageSize
    {
        width: 50px;
    }
    img
    {
        max-width: 610px;
    }
</style>
<form id="frmData" method="get">
<div id="contents">
    <div id="box_insite">
        <div class="header_in">
            <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                    <td width="190" class="in_top">
                        {MediaGallery}
                    </td>               
                    <td class="in_right">
                        &nbsp;
                    </td>      
                </tr>
            </table>
        </div>
        <div class="in_conts">
            <!--listbanner-->
            <div class="box_conts_header">
                {Search}
            </div>
            <div class="box_conts_line">
            </div>
            <br />
            <table cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                    <td width="13%">
                        {Category}
                    </td>
                    <td>
                        {slCategory}
                    </td>
                </tr>
                <tr style="height: 25px;">
                    <td>
                        {Language}
                    </td>
                    <td>
                        {slLanguage}
                    </td>
                </tr>
                <tr style="height: 25px;">
                    <td>
                        {Currency}
                    </td>
                    <td>
                        {slCurrency}
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td style="height: 35px; padding-left: 50px;">
                        <input type="button" class="button" value="{Search}" name="btnSearch" onclick="checkData();LoadData(1);" />
                    </td>
                </tr>
            </table>
            <br />
            <!--/listbanner-->
            <div class="box_conts_header">
                {TextLink}
            </div>
            <div class="box_conts_line">
            </div>
            <br />
            <table cellpadding="2" cellspacing="0" width="100%" border="0">
                <tr>
                    <td style="white-space: nowrap; width: 120px;">
                        {AvailableDomains}
                    </td>
                    <td>
                        {slDomain}
                    </td>
                    <td class="cont12oe">
                    </td>
                </tr>
                <tr>
                    <td style="white-space: nowrap; width: 120px;">
                        {LinkToLabel}
                    </td>
                    <td>
                        {target}&nbsp;
                        <input type="button" class="button" value="{GenerateLink}" name="btnGenerateLink"
                            onclick="checkData();LoadData(1);" />
                    </td>
                    <td class="cont12oe">
                    </td>
                </tr>
                <!--TextLinkList-->
                <tr>
                    <td style="white-space: nowrap; width: 120px;" id="textlink">
                        {language_val}
                    </td>
                    <td>
                        <span class="textlink">{link_val} </span>
                    </td>
                    <td class="cont12oe">
                    </td>
                </tr>
                <!--/TextLinkList-->
            </table>
            <br />
            <!--listbanner-->
            <div class="box_conts_header">
                {Banner}
            </div>
            <div class="box_conts_line">
            </div>
            <br />
            {paging-top}
            <div id="fb-root">
            </div>
            <script src="http://connect.facebook.net/en_US/all.js#appId=226866500670079&amp;xfbml=1"></script>
            <div class="tbl-box">
                <table class="aff-table" cellspacing="1" cellpadding="1">
                    <tbody id="result">
                        <!--Content-->
                        <tr>
                            <td class='cont12oe' colspan='3'>
                                {messagevalue}
                            </td>
                        </tr>
                        <tr>
                            <td class='cont12oe' colspan='3'>
                                 <input type='text' style='width: 610px' onclick='this.focus();this.select()' 
                                value = "&lt;a class='banner_{SystemName}{bannerid}' onclick='window.open(&quot;{signuplink}?ref=&quot; + location.href,&quot;_blank&quot;); return false;' href='{signuplink}' target='_blank' id=&quot;bannerContainer&quot;&gt;&lt;/a&gt;&lt;script src=&quot;{bannerscripturl}{bannerid}?signuplink={signuplink}&quot; type=&quot;text/javascript&quot;&gt;&lt;/script&gt;" />
                            </td>
                        </tr>
                        <!--/Content-->
                    </tbody>
                </table>
            </div>
            {paging-bottom}
            <!--/listbanner-->
        </div>
    </div>
</div>
<input type="hidden" id="page" name="page" value="{page}" />
<input type="hidden" id="hdTrack" name="hdTrack" value="{track-val}" />
</form>
