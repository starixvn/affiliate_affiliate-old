<script type="text/javascript">
    var paththeme = "{paththeme}";
</script>

<div class="padl0">
    <div id="errMsg" style="display: none; width: 243px;">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    <div class="pcontent">
        <div class="ContentBox" style="width: 300px;">
            <table class="tblPass" bordercolor="#d4d0c8" width="100%" border="0">
                <tr>
                    <td class="right">
                        {FirstName}
                    </td>
                    <td class="left" id="td_pass">
                        <input id="txtfirstname" type="text" name="txtfirstname" class="textbox" value="{firstname_value}"
                            onkeypress="PreExec(event,{custid},'{Dep_value}')" />
                    </td>
                </tr>
                <tr>
                    <td class="right">
                        {LastName}
                    </td>
                    <td class="left" id="td_confirm">
                        <input id="txtlastname" type="text" name="txtlastname" class="textbox" value="{lastname_value}"
                            onkeypress="PreExec(event,{custid},'{Dep_value}')" />
                    </td>
                </tr>
                <tr>
                    <td class="right">
                        {Department}
                    </td>
                    <td class="left" id="td1">
                        <select id="SelDep" name="SelDep">
                            {option}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <br />
    <div style="text-align:left;">
        <input type="button" name="btnSubmit" value="{submit}" id="btnSubmit" class="buttonlogin"
            onclick="EditUser({custid},'{Dep_value}')" />&nbsp;
        <input name="btnCancel" id="btnCancel" type="button" onclick="parent.ibcWnd.close();"
            class="buttonlogin" value="{cancel}" />
    </div>
</div>
<input type="hidden" id="isdep" value="{isdep}" />
<input type="hidden" id="depid" value="{depid}" />
<input type="hidden" id="depname" value="{depname}" />
<input type="hidden" id="AlertSucc" value="{AlertSucc}" />
