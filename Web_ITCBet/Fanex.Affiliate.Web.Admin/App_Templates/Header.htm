<script language="javascript" type="text/javascript">
    var year = {year};
    var month = {month};
    var day = {day};
    var hrs = {hour};
    var min = {minute};
    var sec = {second};    
    var gmt_offset = '{gmt_offset}';  
    var rooturl = '{rooturl}';

    function ChangeLanguage(InLang) {
    var lang = 'en-US';
    if (InLang != null) {
        lang = InLang;
        setCookie("afffavoritelang", lang, 30);
    }

    var d = new Date();
    var _ajax = new Ajax.Request( rooturl + "/Handler/SetLanguage.ashx", {
        asynchronous: true,
        method: 'get',
        parameters: 'lang=' + lang + '&d=' + d.getMilliseconds(),
        onComplete: function (data) {

            UpdateLangSuccess(data, lang);
        }
    });

}
</script>
