<div id="padl0">
    {submenu}
    <form id="frmSearch" name="frmSearch" method="get" style="margin: 7px 0;">
    <input type="hidden" id="page" name="page" value="{page}" />    
    <input type="submit" value="" class="hide" />  
    
    <div id="divContent" class="ContentBox" style="width: {width}px; overflow: visible;">
        <table class="aff-table" width="100%">
            <tr>
                <td><div id="title" class="timelimit">{qmreportdetailof} [{affname-val}] {in} {month-val}-{year-val}</div></td>
            </tr>
        </table>
            
        {paging-top}
        <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
            <!--header-->
            <tr>  
                <th>&nbsp;</th>              
                <th style="width:100px;">{PlayerUserName}</th>
                <th>
                    {Product}
                </th>
                <th>
                    {turnover}
                </th>
                <th>
                    {IsQualifiedMember}
                </th>                
            </tr>            
            <!--/header-->
            <!--nodata-->
            <!--content-->
            <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td>{num-val}</td>
                <td class="l" style="width: 55px;">
                    {username-val}
                </td>
                <td>
                    {product-val}
                </td>
                <td>
                    {turnover-val}
                </td>
                <td class="c">
                    <input type="checkbox" {isqualifiedmember-val}" disabled="true" />
                </td>                
            </tr>
            <!--/content-->
            <!--/nodata-->
        </table>
        {paging-bottom}
    </div>
    <input type="hidden" name="month" id="month" value="{month-val}"/>
    <input type="hidden" name="year" id="year" value="{year-val}"/>
    <input type="hidden" name="affname" id="affname" value="{affname-val}" />
    <input type="hidden" name="affid" id="affid" value="{affid-val}" />
    <input type="hidden" name="productid" id="productid" value="{productid-val}" />
    </form>
</div>
