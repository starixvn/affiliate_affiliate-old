<div class="padl0">
{submenu}
<!--search form-->
<form id="frmSearch" name="frmSearch" method="get">
    <div id="search_cont">
        <div id="header_search">
            Country&nbsp;&nbsp;&nbsp;&nbsp;{slMarket}&nbsp;&nbsp;&nbsp;&nbsp;<input type="submit" value="{Submit}" />
        </div>
        <div id="spTime" style="float:right; vertical-align:middle; padding: 3px 10px 0 0;"></div>
    </div>
</form>

<div class="divpageleft" style="display: inline-block;"><a class="abutton" href="javascript:AddDomainControl();"><span id="Span1">{AddNew}</span></a></div>
<!--/search form-->
<table class="aff-table" cellpadding="3" cellspacing="1" style="width: 900px;"> 
<!--header-->
<tr>
    <th style="width:10px">&nbsp;</th>
    <th>{AffDomain}</th>
    <th>{RedirectDomain}</th>
    <th>{Country}</th>
    <th>{Creator}</th>
    <th>{CreatedDate}</th>
    <th style="width:45px">{Status}</th>
    <th style="width:45px">{Edit}</th>
    <th style="width:45px">{Del}</th>
</tr>
<!--/header-->
<!--content-->
<tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
    <td class="c">{no}</td>
    <td>{AffDomain-val}</td>
    <td>{RedirectDomain-val}</td>
    <td class="c">{Market-val}</td>
    <td class="c">{Creator-val}</td>
    <td class="c">{CreatedDate-val}</td>
    <td class="c"><span class="chk {Status-val}">&nbsp;</span></td>
    <td class="c"><span class="icedit" onclick="DoCal('DomainControlUpd.aspx?id={ID-val}&affdomain={AffDomainId-val}&redirectdomain={RedirectDomainId-val}&market={MarketId-val}&status={Status-value}', 'Edit Domain Control', 450, 250);">&nbsp;</span></td>
    <td class="c"><span class="icdel" onclick="DomainControlDel('{ID-val}')">&nbsp;</span></td>
</tr>
<!--/content-->
</table>
<div class="divpageleft" style="display: inline-block;"><a class="abutton" href="javascript:AddDomainControl();"><span id="Span2">{AddNew}</span></a></div>
</div>
