<div id="padl0">
    {submenu}
    <form id="frmSearch" name="frmSearch" method="get" style="margin: 7px 0;">
    <div id="search_cont">
        <table cellspacing="1" cellpadding="3" border="0">
            <tr>
                <td class="r">
                    {Affiliate}
                </td>
                <td>
                    <input type="text" name="affname" id="affname" size="13" value="{affname}" class="txtdate-no-time" />
                </td>
                <td>
                    {listlang}
                </td>
                <td>
                    {lscurrency}
                </td>
                <!--afftype-->
                <td>
                    {afftypelist}
                </td>
                <!--/afftype-->
                <td class="r">
                    {From}
                </td>
                <td>
                    <input type="text" readonly name="fdate" size="13" value="{fdate}" class="txtdate-no-time"
                        id="fdate" />&nbsp;
                    <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                        style="margin-bottom: -3px;" title="Date selector" id="fdateTrigger" />

                    <script type="text/javascript">
                        Calendar.setup({
                            inputField: "fdate",
                            ifFormat: "%m/%d/%Y",
                            button: "fdateTrigger",
                            singleClick: true,
                            showsTime: false,
                            showOthers : true,
                            step : 1
                        });
                    </script>

                </td>
                <td class="r">
                    {To}
                </td>
                <td>
                    <input type="text" readonly name="tdate" size="13" value="{tdate}" class="txtdate-no-time"
                        id="tdate" />&nbsp;
                    <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                        style="margin-bottom: -3px;" title="Date selector" id="tdateTrigger" />

                    <script type="text/javascript">
                        Calendar.setup({
                            inputField: "tdate",
                            ifFormat: "%m/%d/%Y",
                            button: "tdateTrigger",
                            singleClick: true,
                            showsTime: false,
                            showOthers : true,
                            step : 1
                        });
                    </script>
                </td>
                <td class="nowrap">
                    Get All&nbsp;&nbsp;<span onclick="chkOnclick();" id="chkDate" class="{cssgetall}">&nbsp;</span>
                    <input type="hidden" id="isGetAll" name="isGetAll" value="{cssgetall}" />
                </td>
                <td style="width: 100px">
                    <span id="divsearch" onclick="Search();">&nbsp;</span>
                </td>
            </tr>
        </table>
    </div>
    <input type="hidden" id="page" name="page" value="{page}" />    
    <input type="submit" value="" class="hide" />  
    <input type="hidden" id="hdLanguage" name="hdLanguage" value="{lang-val}" />
    <input type="hidden" id="type" name="type" value="{type-val}" />
    <div id="divContent" class="ContentBox" style="width: {width}px; overflow: visible;">
        {paging-top}
        <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
            <!--header-->            
            <tr>        
                <th rowspan="2" style="width:20px;">&nbsp;</th>
                <th rowspan="2" style="width:100px;">{affiliate}</th>
                <!--afftype-->
                <th rowspan="2" style="width:100px;">{afftype}</th>
                <!--/afftype-->
                <th colspan="3">
                    {deposit}
                </th>                
                <th rowspan="2">
                    {totalregister}
                </th>
            </tr>            
            <tr>  
                <th>{active}</th>
                <th>
                    {dormant}
                </th>
                <th>
                    {total}
                </th>
            </tr>            
            <!--/header-->
            <!--nodata-->
            <!--content-->
            <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td>
                    {no}
                </td>
                <td class="l" style="width: 55px;">
                    <a href="MemberStatisticsReportDetail.aspx?affname={aff-val}&affid={affid-val}&fdate={fdate}&tdate={tdate}&isGetAll={cssgetall}&type={type-val}">{aff-val}</a>
                </td>
                <!--afftype-->
                <td class="l">
                    {afftype-val}
                </td>
                <!--/afftype-->
                <td>
                    {active-val}
                </td>
                <td>
                    {dormant-val}
                </td>
                <td>
                    {total-val}
                </td>
                <td>
                    {totalregister-val}
                </td>
            </tr>
            <!--/content-->
            <!--/nodata-->
        </table>
        {paging-bottom}
    </div>
    </form>
</div>
