    {submenu}
    <div id="errMsg" style="display: none; width: 400px;">
        <div id="error_item">
            <ul>
                <li><a id="error_msg" class="err-msg"></a></li>
            </ul>
        </div>
    </div>
    <div id="search_cont">
        <div id="header_search" style="padding:2px 0px 0px 0px">
            {TrackingCode} &nbsp; {slTrackingCode}&nbsp;&nbsp;
            <input type="button" value="{Submit}" id="btnSubmit" name="{Submit}" class="buttonlogin"
                onclick="ViewStatisticsAll();" />
        </div>
    </div>
    <table class="aff-table" cellspacing="1" cellpadding="2" id="tblResult" style="width: 400px;">
        <tr>
            <th style="width:20px;">&nbsp;</th>
            <th width="220px">{Month}</th>
            <th style="width:80px;">{TotalClicks}</th>
            <th style="width:80px;">{UniqueClicks}</th>
        </tr>
        <tbody id="result">
        <!--Content-->
        <tr class="nowrap" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
            <td class="c">{No-val}</td>
            <td class="c"><a href="javascript:void(0);" onclick="ViewStatisticsDetail('{MonthFull-val}');">{Month-val}</a></td>
            <td class="c">{TotalClick-val}</td>
            <td class="c">{UniqueClick-val}</td>
        </tr>
        <!--/Content-->
        </tbody>
    </table>
    <div id="statisticsDetail" style="display: none;">
        <!--StatisticsDetail-->
        <table class="aff-table" cellspacing="1" cellpadding="3" border="0" width="400px"
            id="tblResultDetail">
            <tr>
                <th style="width:20px;">&nbsp;</th>
                <th style="width:220px;">{Date}</th>
                <th style="width:80px;">{TotalClick}</th>
                <th style="width:80px;">{UniqueClick}</th>
            </tr>
            <tbody id="resultDetail">
                <!--StatisticsDetailContent-->
                <tr class="nowrap" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                    <td class="c">{No-val}</td>
                    <td class="c">{Date-val}</td>
                    <td class="c">{TotalClick-val}</td>
                    <td class="c">{UniqueClick-val}</td>
                </tr>
                <!--/StatisticsDetailContent-->
            </tbody>
        </table>
        <!--/StatisticsDetail-->
    </div>
