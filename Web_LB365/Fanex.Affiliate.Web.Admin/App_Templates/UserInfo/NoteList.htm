<form id="frmSearch" name="frSearch" method="get">
        {submenu}
        <table class="ContentInput" width="682px" cellspacing="0" id="noteForm" style="display: none;">
            <tr>
                <td>
                    <textarea id="txtNote" name="txtNote" rows="3" style="width: 550px;"></textarea><br />
                    <input type="button" id="btnAddNote" name="btnAddNote" onclick="AddNote();" value="{addnote}" />
                    <input type="button" onclick="hideForm();" value="{cancel}" />
                </td>
            </tr>
        </table>
        <div id="errMsg" style="display: none; width: 630px;">
            <div id="error_item">
                <ul>
                    <li><a id="error_msg" class="err-msg"></a></li>
                </ul>
            </div>
        </div>
        <div id="divNote">
            <!--notelist-->
        {paging-top}
            <table class="aff-table" cellspacing="1" cellpadding="1" width="682px">
                <tr>
                   <!-- <th class="title" style="width:12px">&nbsp;</th> -->
                    <th class="title" style="width:12px">&nbsp;</th>
                    <th class="title" style="">{content}</th>
                    <th class="title" style="width: 90px;">{createdby}</th>
                    <th class="title" style="width: 140px;">{lastmodify}</th>
                    <th class="title" style="width: 30px;">{edit}</th>
                    <!-- <th class="title" style="width: 30px;">{del}</th> -->
                </tr>
                <!--content-->
                <tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">                
                   <!-- <td><div class="chk ic-uncheck" id="{noteid}"> </div></td> -->
                    <td class="c">{no-val}</td>
                    <td id="{noteid}" class="l">{content-val}</td>
                    <td>{createdby-val}</td>
                    <td>{lastmodify-val}</td>
                    <td class="c"><span class="icedit" onclick="editNote('{noteid}');">&nbsp;</span></td>
                   <!-- <td class="c"><span class="icdel" onclick="deleteNote('{noteid}');">&nbsp;</span></td> -->
                </tr>
                <!--/content-->
            </table>
        {paging-bottom}
            <!--/notelist-->
        </div> 
        <div class="bottombutton">
            <!--nocontent-->
            <!--<a href="javascript:DelNote();" class="abutton" style="margin-right: 5px;">
                <span id="Del">{Delete}</span>
            </a> -->
            <!--/nocontent-->
            <a href="javascript:AddNote();" class="abutton" style="margin-right: 5px;">
                <span id="Add Note">{add}</span>
            </a>
        </div>
    <input type="hidden" id="custid" name="custid" value="{custid}" />
    <input type="hidden" id="noteid" name="noteid" value="" />
    <input type="hidden" id="page" name="page" value="{page-val}" />
    <input type="hidden" id="approved" name="approved" value="{approved-val}" />
</form>
