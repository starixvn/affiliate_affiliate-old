    <style type="text/css">
        #addsetting
        {
            margin-left:10px;
        }
        .vrow
        {
            margin-bottom:10px;
        }
        .vrow .label
        {
            margin-bottom:4px;
        }
        textarea, .input input, select
        {
            width:550px;
        }       
    </style>
    <input type="hidden" value="{Country-ID}" />
    <form id="addsetting">   
        <div class="vrow">
            <div class="label">{ID}</div>
            <div class="input">
                <input id="languageid" {Disabled} type="text" value="{LanguageID}" />
            </div>
        </div>                            
        <div class="vrow">
            <div class="label">{Name}</div>
            <div class="input">
                <input id="languagename" type="text" value="{LanguageName}" />
            </div>
        </div>                  
         <div class="vrow">
            <label class="label">{Country}</label>     
            <div class="input">       
                  {Countries}
            </div>
        </div>   
        <div class="vrow">
            <a class="abutton" href="javascript:;" onclick="updateLanguage();"><span id="submitText">{Action}</span></a>
            <a class="abutton" href="javascript:;" onclick="ClosePopupNoReload();"><span id="Span1">{Cancel}</span></a>
        </div>
    </form>

<script type="text/javascript">

    function updateLanguage() 
    {
        var data = {
            action: $("languageid").getAttribute("disabled") ? "update" : "add",
            id: $F('languageid'),
            name: $F('languagename'),
            countryid: $F('countries'),            
        };      
       
        var ajax = new Ajax.Request("../Handler/LanguageHandler.ashx", {
            method: 'post',
            parameters: data,
            onComplete: function(data) {
                if(data.responseText == 'True')
                {
                    ClosePopup();
                }
                else
                {
                    alert(data.responseText);
                }
            }
        });
    }
</script>
