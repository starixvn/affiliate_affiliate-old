<script language="javascript" type="text/javascript">
    function BannerUpload() {
        var box = $("slSubCategoryMedia");
        var text = null;
        if (jQuery("#slSubCategoryMedia").is(":visible")) {
            text = box.selectedIndex >= 0 ? box.options[box.selectedIndex].innerHTML : undefined;
        }
        

        $("hidSubCategory").value = text;
        
        var bannerID = $("hdBannerID").value;
        if ($("hdBannerID").value > 0) {
            $("UploadBanner").submit();
            return;
        }

        if ($("txtfile").value == "") {
            alert(top.fMenu.Msg.SelectBannerUpload);
            return;
        }
        else {
            var fileName = $("inpFileName").value;
            if (fileName.length > 50) {
                alert("{MaxFileNameLength}");
                return;
            }


            $("UploadBanner").submit();
        }                
    }
</script>
<div class="padl0">
    <div id="errMsg" style="display: none;width: 370px;" class="styleErrAddbanner">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    <form action="{formAction}" method="post" enctype="multipart/form-data"
    target="upload_target" onsubmit="return IsValidFileExtension();" id="UploadBanner">
    <div class="pcontent" style="width: 420px; text-align: center;">
        <table cellspacing="5" cellpadding="0" width="100%">
            <tr>
                <td>
                    &nbsp;
                </td>
                <td>
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="l" colspan="2">
                    [{ValidTypes}: .gif, .jpg, .png, .jpeg, .swf]<br></br>
                    [{FileSizeLimit}: 3MB]
                </td>
            </tr>
            <tr>
                <td>
                    &nbsp;
                </td>
                <td>
                    &nbsp;
                </td>
            </tr>
            <tr class="l" valign="middle">
                <td colspan="2" style="padding-left: 50px; color: red">
                </td>
            </tr>
            <tr class="l">
                <td width="100px;" class="txt_addnew">
                    {File}
                </td>
                <td style="padding-bottom: 3px;" id="contentfile">
                    <input id="txtfile" name="txtfile" width="400px" height="19px" size="50" type="file"
                        value="" onchange="return IsValidFileExtension(this);" style="color: Green; border: solid 1px #000000;" />
                </td>
            </tr>
            <tr class="l">
                <td class="txt_addnew">
                    {Category}
                </td>
                <td style="padding-bottom: 3px;">
                    {optioncate}
                </td>
            </tr>
            <tr class="l" id="trSubCategoryMedia">
                <td class="txt_addnew">
                    {SubCategory}
                </td>
                <td style="padding-bottom: 3px;">
                    {optionsubcate}
                </td>
            </tr>
            <tr class="l">
                <td class="txt_addnew">
                    {AffType}
                </td>
                <td style="padding-bottom: 3px;">
                    {optionafftype}
                </td>
            </tr>
            <tr class="l">
                <td class="txt_addnew">
                    {Language}
                </td>
                <td style="padding-bottom: 3px;">
                    {optionlang}
                </td>
            </tr>
            <tr class="l">
                <td class="txt_addnew">
                    {Currency}
                </td>
                <td style="padding-bottom: 3px;">
                    {optioncurrency}
                </td>
            </tr>
            <tr class="l" >
                <td class="txt_addnew">
                    {Type}
                </td>
                <td style="padding-bottom: 3px;" >
                    {optiontype}
                </td>
            </tr>

            <tr class="l">
                <td class="txt_addnew">
                    {FileName}
                </td>
                <td style="padding-bottom: 3px;">
                    <input type="text" id="inpFileName" name="inpFileName" size="50" value="{filenamevalue}" />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div style="text-align: left; margin-top: 5px;">
        <input id="btnuploadbanner" class="buttonlogin" name="btnuploadbanner"
            type="button" value="{Upload}" onclick="BannerUpload();"/>&nbsp;
        <input id="btncancel" class="buttonlogin" name="btncancel" type="button" value="{Cancel}"
            onclick="Cancelfunction();" />
    </div>    
    <input type="hidden" id="hidSubCategory" name="hidSubCategory" value="{subCategory}" />
    <input type="hidden" id="hdOldFileName" name="hdOldFileName" value="{oldfilenamevalue}" />
    <input type="hidden" id="hdOldCategory" name="hdOldCategory" value="{oldCategory}" />
    <input type="hidden" id="hdBannerID" name="hdBannerID" value="{bannerid}" />
    <input type="hidden" id="hdSize" name="hdSize" value="{size}" />
    <input type="hidden" id="hdImageType" name="hdImageType" value="{imagetype}" />
    </form>
</div>
<iframe id="upload_target" name="upload_target" src="#" style="width: 0; height: 0;
    border: 0px solid #fff;"></iframe>
<input id="hdErrFileExtension" name="hdErrFileExtension" type="hidden" value="{ErrFileExtension}" />
