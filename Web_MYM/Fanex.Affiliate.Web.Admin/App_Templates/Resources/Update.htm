    <style type="text/css">
        #addsetting
        {
            margin-left:10px;
        }
        .vrow
        {
            margin-bottom:10px;
        }
        .vrow .label
        {
            margin-bottom:4px;
        }
        #key, #rvalue, #description
        {
            width:550px;
        }
        #key, #type, #lang
        {
            height:24px;
        }
        #rvalue
        {
            height:300px;
        }
        #description
        {
            height:40px;
        }
    </style>
    <div id="addsetting">
        <div class="vrow">
            <div class="label">{Key}</div>
            <div class="input">
                <input id="key" type="text" disabled="disabled" value="{SName}" />
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Type}</div>
            <div class="input">
                <select id="type" disabled="disabled">
                    {Types}
                </select>
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Language}</div>
            <div class="input">                
                    {Languages}                
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Description}</div>
            <div class="input">
                <textarea id="description">{SDescription}</textarea>
            </div>
        </div>
        <div class="vrow">
            <div class="label">
                Value
                <a href="javascript:;" onmousedown="switchEditor(true);">[rich text editor]</a>
		        <a href="javascript:;" onmousedown="switchEditor(false);">[{PlainText}]</a>
            </div>
            <div class="input">
                <textarea id="rvalue">
                    {SValue}
                </textarea>
            </div>
        </div>
        <div class="vrow">
            <a class="abutton" href="javascript:;" onclick="updateSetting();"><span id="Delete">{Update}</span></a>
            <a class="abutton" href="javascript:;" onclick="ClosePopupNoReload();"><span id="Span1">{Cancel}</span></a>
        </div>
    </div>

<script type="text/javascript">
    var richTextMode = true;
    function switchEditor(show)
    {
        if(show)
        {
            tinyMCE.get('rvalue').show();
            richTextMode = true;
        }
        else
        {
            tinyMCE.get('rvalue').hide();
            richTextMode = false;
        }
    }
    function updateSetting()
    {
        var value = encodeURIComponent($('rvalue').value);
        var description = encodeURIComponent($('description').value);
        var lang = encodeURIComponent(document.getElementById('lang').value);
        if(richTextMode)
        {
            value = encodeURIComponent(tinyMCE.get('rvalue').getContent());
        }
        if(value.length < 1)
        {
            alert(top.fMenu.Msg.InputValueTranslation);
            return;
        }
        var ajax = new Ajax.Request("../Handler/ResourceHandler.ashx", {
            method: 'post',
            parameters: "action=update&id={Id}&plaintext=" + !richTextMode + "&value=" + value + "&lang=" + lang + "&description=" + description,
            onComplete: function(data) {
                if(data.responseText == 'True')
                {
                    ClosePopup();
                }
                else
                {
                    alert(data.responseText);
                }
            }
        });
    }
</script>
<script type="text/javascript" language="javascript">
    tinyMCE.init({
		mode : "exact",
		elements: "rvalue",
		theme : "advanced",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_resizing : true,
		
		plugins: "safari,spellchecker,pagebreak,style,layer,table,save,advhr,advimage,advlink,emotions,iespell,inlinepopups,insertdatetime,preview,media,searchreplace,contextmenu,paste,directionality,fullscreen,noneditable,visualchars,nonbreaking,xhtmlxtras,template",
		
		theme_advanced_buttons1: "bold,italic,underline,strikethrough,|,justifyleft,justifycenter,justifyright,justifyfull,|,formatselect,fontselect,fontsizeselect,|,forecolor,backcolor",
        theme_advanced_buttons2: "pastetext,pasteword,|,search,replace,|,bullist,numlist,|,outdent,indent,blockquote,|,undo,redo,|,link,unlink,anchor,image,cleanup,|,insertdate,inserttime,preview,spellchecker",
        theme_advanced_buttons3: "table,|,hr,removeformat,|,sub,sup,|,charmap,emotions,iespell,media,|,ltr,rtl,|,fullscreen",
        force_br_newlines : true,
        force_p_newlines : false,
        forced_root_block : ''
	});
</script>
