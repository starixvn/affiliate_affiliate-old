<style type="text/css">
    #addsetting
    {
        margin-left:10px;
    }
    .vrow
    {
        margin-bottom:10px;
    }
    .vrow .label
    {
        margin-bottom:4px;
    }
    #member, #affiliate
    {
        width:200px;
        height:24px;
    }
</style>
<div id="addsetting">
    <div class="vrow">
        <div class="label">{Member}</div>
        <div class="input">
            <input id="member" type="text" />
        </div>
    </div>
    <div class="vrow">        
        <div class="label">{Affiliate}</div>
        <div class="input">
            <input id="affiliate" type="text" />
        </div>
    </div>
    <div class="vrow">
        <a class="abutton" href="javascript:;" onclick="assignMemberToAffiliate();"><span id="Delete">Assign</span></a>
        <a class="abutton" href="javascript:;" onclick="ClosePopupNoReload();"><span id="Span1">{Cancel}</span></a>
    </div>
</div>
<script type="text/javascript" language="javascript">
    function assignMemberToAffiliate()
    {
        var member = encodeURIComponent($('member').value.trim());
        var affiliate = encodeURIComponent($('affiliate').value.trim());
        
        if(member.length < 1)
        {
            alert(top.fMenu.Msg.InputMem);
            return;
        }
        if(affiliate.length < 1)
        {
            alert(top.fMenu.Msg.InputAff);
            return;
        }
        
        var ajax = new Ajax.Request("../Handler/AddMemberToAffiliate.ashx", {
            method: 'post',
            parameters: "member=" + member + "&affiliate=" + affiliate,
            onComplete: function(data) {
                if(data.responseText == 'True')
                {
                    ClosePopup();
                }
                else
                {
                    alert(data.responseText);
                }
            }
        });
    }
</script>
