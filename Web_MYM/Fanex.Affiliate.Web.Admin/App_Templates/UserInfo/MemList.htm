<form id="frSearch" name="frSearch" method="get">  
      <div style="padding-bottom:5px;">
        {username2}&nbsp;&nbsp;<input type="text" id="txtUsername2" name="txtUsername2" value="{user2-val}" />&nbsp;&nbsp;
      {username}&nbsp;&nbsp;<input type="text" id="txtUsername" name="txtUsername" value="{user-val}" />
        &nbsp;&nbsp;<input type="submit" value="{search}" onclick="$('page').value='1';" />
      </div>
      <table class="aff-table" cellspacing="1" cellpadding="3" width="832px">
        <!--header-->
        <tr style="white-space:nowrap;">
          <th>&nbsp;</th>
          <th>{username2}</th>
          <th>{username}</th>
          <th>{fname}</th>
          <th>{lname}</th>
          <th style="width:140px">{CurrentBalanceMem}</th>
          <th>{CreateDate}</th>          
          <th>{Status}</th>
        </tr>
        <!--/header-->
        <!--content-->
        <tr title="{rowinfo}" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'" class="nowrap">
          <td class="r">{number}</td>
          <td class="l">{username2-val}</td>
          <td class="l">{username-val}</td>
          <td class="l">&nbsp;{fname-val}</td>
          <td class="l">&nbsp;{lname-val}</td>
          <td class="number">{CurrentBalanceMem-val}</td>
          <td>&nbsp;{CreateDate-val}</td>          
          <td>&nbsp;{Status-val}</td>
        </tr>
        <!--/content-->
      </table>  
  <input type="hidden" id="page" name="page" value="{page-val}" />
</form>
