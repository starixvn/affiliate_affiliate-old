<div id="padl0">
    {submenu}
    <form id="frmSearch" name="frmSearch" method="get" style="margin: 7px 0;">
    <div id="search_cont">
        <table cellspacing="1" cellpadding="3" border="0">
            <tr>
                <td class="r">
                    {aff-txt}
                </td>
                <td>
                    <input type="text" name="affname" id="affname" size="13" value="{affname}" onfocus="Focus()" onblur="Blur()" class="txtdate-no-time" />
                </td>
                <td>
                    <select name="slPreferLang" id="slPreferLang">
                        <option value="">Select Language</option>
                        <option value="en-US">English</option>
                        <option value="en">English_Euro</option>
                        <option value="zh-TW">Chinese Traditional</option>
                        <option value="zh-CN">Chinese Simplified</option>
                        <option value="th-TH">Thai</option>
                        <option value="es-ES">Spanish</option>    
                        <option value="vi-VN">Vietnamese</option>    
                        <option value="id-ID">Indonesian</option>            
                    </select>
                </td>
                <td class="r">
                    {month-txt}
                </td>
                <td>
                    <select id="slmonth" name="slmonth" class="r">
                        <option value="1">01</option>
                        <option value="2">02</option>
                        <option value="3">03</option>
                        <option value="4">04</option>
                        <option value="5">05</option>
                        <option value="6">06</option>
                        <option value="7">07</option>
                        <option value="8">08</option>
                        <option value="9">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </td>
                <td class="r">
                    {year-txt}
                </td>
                <td>
                    <select id="slyear" name="slyear" class="r">
                        <option value="2008">2008</option>
                        <option value="2009">2009</option>
                        <option value="2010">2010</option>
                        <option value="2011">2011</option>
                        <option value="2012">2012</option>
                    </select>
                </td>
                <td style="width: 100px">
                    <span id="divsearch" onclick="Search();">&nbsp;</span>
                </td>
            </tr>
        </table>
    </div>
    <input type="hidden" id="page" name="page" value="{page}" />    
    <input type="submit" value="" class="hide" />  
    <input type="hidden" id="hdLanguage" name="hdLanguage" value="{lang-val}" />
    
    <div id="divContent" class="ContentBox" style="width: 550px; overflow: visible;">
        {paging-top}
        <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
            <!--header-->
            <tr>  
                <th>&nbsp;</th>              
                <th style="width:100px;">{affiliate}</th>
                <th>
                    {sportsbook}
                </th>
                <th>
                    {horseracing}
                </th>
                <th>
                    {total}
                </th>
            </tr>            
            <!--/header-->
            <!--nodata-->
            <!--content-->
            <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td>{num-val}</td>
                <td class="l" style="width: 55px;">
                    <a href="AffiliateQMReportDetail.aspx?affid={affid-val}&affname={aff-val}&month={month-val}&year={year-val}">{aff-val}</a>
                </td>
                <td>
                    {sportsbook-val}
                </td>
                <td>
                    {horseracing-val}
                </td>
                <td>
                    {total-val}
                </td>
            </tr>
            <!--/content-->
            <!--/nodata-->
        </table>
        {paging-bottom}
    </div>
    <input type="hidden" name="month" id="month" value="{month-val}"/>
    <input type="hidden" name="year" id="year" value="{year-val}"/>
    <input type="hidden" name="all" id="all" value="{all-val}"/>
    </form>
</div>
