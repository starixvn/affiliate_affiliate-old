    <style type="text/css">
        #addsetting
        {
            margin-left:10px;
        }
        .vrow
        {
            margin-bottom:10px;
        }
        .vrow .label
        {
            margin-bottom:4px;
        }
        #key, #rvalue, #description
        {
            width:550px;
        }
        #key, #type, #lang
        {
            height:24px;
        }
        #rvalue
        {
            height:300px;
        }
        #description
        {
            height:40px;
        }
    </style>
    <div id="addsetting">
        <div class="vrow">
            <div class="label">{Key}</div>
            <div class="input">
                <input id="key" type="text" />
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Type}</div>
            <div class="input">
                <select id="type">
                    {Types}
                </select>
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Language}</div>
            <div class="input">                
                    {Languages}                
            </div>
        </div>
        <div class="vrow">        
            <div class="label">{Description}</div>
            <div class="input">
                <textarea id="description"></textarea>
            </div>
        </div>
        <div class="vrow">
            <div class="label">
                Value
                <a href="javascript:;" onmousedown="switchEditor(true);">[rich text editor]</a>
		        <a href="javascript:;" onmousedown="switchEditor(false);">[{PlainText}]</a>
            </div>
            <div class="input">
                <textarea id="rvalue"></textarea>
            </div>
        </div>
        <div class="vrow">
            <a class="abutton" href="javascript:;" onclick="addSetting();"><span id="Delete">{Add}</span></a>
            <a class="abutton" href="javascript:;" onclick="ClosePopupNoReload();"><span id="Span1">{Cancel}</span></a>
        </div>
    </div>

<script type="text/javascript">
    var richTextMode = true;
    function switchEditor(show)
    {
        if(show)
        {
            tinyMCE.get('rvalue').show();
            richTextMode = true;
        }
        else
        {
            tinyMCE.get('rvalue').hide();
            richTextMode = false;
        }
    }
    function addSetting()
    {
        var key = encodeURIComponent($('key').value);
        var type =  encodeURIComponent(document.getElementById('type').value);
        var lang =  encodeURIComponent(document.getElementById('lang').value);
        var description =  encodeURIComponent($('description').value);
        var value = encodeURIComponent($('rvalue').value);
        if(richTextMode)
        {
            value = encodeURIComponent(tinyMCE.get('rvalue').getContent());
        }

        if(key.length < 1)
        {
            alert('{InputKeyName}');
            return;
        }
        if(value.length < 1)
        {
            alert('{InpuResourceVal}');
            return;
        }
        var ajax = new Ajax.Request("../Handler/ResourceHandler.ashx", {
            method: 'post',
            parameters: "action=add&key=" + key + "&type=" + type + "&plaintext" + !richTextMode + "&value=" + value + "&lang=" + lang + "&description=" + description,
            onComplete: function(data) {
                if(data.responseText == 'True')
                {
                    ClosePopup();
                }
                else
                {
                    alert(data.responseText);
                }
            }
        });
    }
</script>
<script type="text/javascript" language="javascript">

        theme_advanced_buttons2: "pastetext,pasteword,|,search,replace,|,bullist,numlist,|,outdent,indent,blockquote,|,undo,redo,|,link,unlink,anchor,image,cleanup,|,insertdate,inserttime,preview,spellchecker",
        theme_advanced_buttons3: "table,|,hr,removeformat,|,sub,sup,|,charmap,emotions,iespell,media,|,ltr,rtl,|,fullscreen",

	});
</script>
