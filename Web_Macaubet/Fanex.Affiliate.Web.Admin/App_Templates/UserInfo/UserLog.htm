<form id="frmSearch" name="frSearch" method="get">
{submenu}
<div id="search_cont">
    <table cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
            <td class="l" width="36">
                {type}
            </td>
            <td class="l" width="140">
                {sllogtype}
            </td>
            <td class="l" width="36">
                {From}
            </td>
            <td class="r" width="80" style="padding: 3px 0px 0px 0px">
                <input type="text" id="fdate" name="fdate" size="13" value="{fdate-val}" class="txtdate-no-time" />&nbsp;
            </td>
            <td class="l" width="38">
                <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand" style="margin-bottom: -3px;" title="Date selector" id="fdateTrigger" />

                <script type="text/javascript">

                    Calendar.setup({
                        inputField: "fdate",
                        ifFormat: "%m/%d/%Y",
                        button: "fdateTrigger",
                        singleClick: true,
                        showsTime: false,
                        showOthers: true,
                        step: 1
                    });
       
                </script>

            </td>
            <td class="l" width="16">
                {To}
            </td>
            <td class="r" width="80" style="padding: 3px 0px 0px 0px">
                <input type="text" id="tdate" name="tdate" size="13" value="{tdate-val}" class="txtdate-no-time" />&nbsp;
            </td>
            <td class="l" width="38">
                <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand" style="margin-bottom: -3px;" title="Date selector" id="tdateTrigger" />

                <script type="text/javascript">
                    Calendar.setup({
                        inputField: "tdate",
                        ifFormat: "%m/%d/%Y",
                        button: "tdateTrigger",
                        singleClick: true,
                        showsTime: false,
                        showOthers: true,
                        step: 1
                    });              
                </script>

            </td>
            <td style="padding: 3px 0px 0px 0px">
                <span id="divsearch" onclick="$('page').value='1';$('frmSearch').submit();">&nbsp;</span>
                <input type="submit" value="{search}" class="hide" />
            </td>
            <td>
            </td>
        </tr>
    </table>
</div>
{paging-top}
<div style="width: 100%">
    <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
        <tr>
            <th width="5%">
                &nbsp;
            </th>
            <th width="5%">
                {id}
            </th>
            <th width="10%">
                {date}
            </th>
            <th width="10%">
                {UpdateBy}
            </th>
            <th width="10%">
                {action}
            </th>
            <th width="49%">
                {description}
            </th>
            <th width="10%">
                {IP}
            </th>
        </tr>
        <!--content-->
        <tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'" class="trLog_{Group_val}" style="{content_style}">
            <td class="c">
                <span>{Number_val}</span><br />
            </td>
            <td class="c">
                <span onclick="toggleGroup(this, 'trLog_{Toogle_Group_val}');" style="{expand_style}" class="log_expand"><span style="color: #0079FF; cursor:pointer;">{RefNo_val}</span> </span>
                <span style="{collapse_style}">{RefNo_val}</span>
            </td>
            <td class="l" style="white-space: nowrap;">
                {LoggedDate_val}
            </td>
            <td class="c">
                {UserName_val}<br />
                ({UserID_val})
            </td>
            <td class="l">
                {Description_val}<br />
                ({SPName_val})
            </td>
            <td class="l">
                {Details_val}
            </td>
            <td class="c">
                <a target="_blank" href="{LastLoginIPCheckerURL-val}">
                                    &nbsp;{IP_val}</a>
                
            </td>
        </tr>
        <!--/content-->
    </table>
</div>
{paging-bottom}
<div class="bottombutton">
</div>
<input type="hidden" id="page" name="page" value="{page-val}" />
</form>
