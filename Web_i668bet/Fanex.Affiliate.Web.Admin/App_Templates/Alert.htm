<script type="text/javascript">
  function exec_refresh()
  {
  window.status = "Redirecting..." + myvar;
  myvar = myvar + " .";
  var timerID = setTimeout("exec_refresh();", 1000);
  if (timeout > 0)
  {
  timeout -= 1;
  }
  else
  {
  clearTimeout(timerID);
  window.status = "";
  window.location = "{link}";
  }
  }

  var myvar = "";
  var timeout = 2;
  exec_refresh();
</script>
<div class="alert-padd">
  <table class="tborder" align="center" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td class="tcat">{redirect}...</td>
      </tr>
      <tr>
        <td class="panelsurround" align="center">
            <p>
              <strong>
                {user} {message}
              </strong>
            </p>

            <p class="smallfont">
              <a href="{link}">{clickhere}</a>
            </p>
            <div>&nbsp;</div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
