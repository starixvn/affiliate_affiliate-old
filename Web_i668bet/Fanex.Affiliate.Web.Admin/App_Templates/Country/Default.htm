<script type="text/javascript">
    var curMsgID=-1;
    window.onload = Init;
    var addEditTpl;
    var listChk;
    function Init() {   
        listChk = $$("div .chk");
        for(var i = 0; i < listChk.length; i++)
        {
            listChk[i].observe('click', chkOnclick);
        } 
    }
    function chkOnclick(event)
    {
        var element = Event.element(event);
        if(element.hasClassName("ic-check"))
            element.className = "chk ic-uncheck";
        else
            element.className = "chk ic-check";
    }
    
    function checkAll(isCheckAll) {
        listChk = $$("div .chk");
        var i = 0;
        if (isCheckAll)
            for (i = 0; i < listChk.length; i++) {
                if (listChk[i].id != "chkDate")
                    listChk[i].className = "chk ic-check";
            }
        else
            for (i = 0; i < listChk.length; i++) {
                if (listChk[i].id != "chkDate")
                    listChk[i].className = "chk ic-uncheck";
            }
    }
    
   
    function deleteCountries()
    {
        listChk = $$("div .chk");
        var i = 0;
        var ids = new Array();
        for(i = 0; i < listChk.length; i++)
        {
            if (listChk[i].hasClassName("ic-check")) {
                ids.push(listChk[i].id);
            }
        }
        
        if(ids.length > 0)
        {
            var answer = confirm("{ConfirmDelCountry}");
            if(answer)
            {
                
                var ajax = new Ajax.Request("../Handler/CountryHandler.ashx", {
                    method: 'post',
                    parameters: "action=delete&id=" + ids,
                    onComplete: function(data) {
                        if(data.responseText == 'True')
                        {
                            window.location.reload();
                        }
                        else
                        {
                            alert(data.responseText);
                        }
                    }
                });
                
            }
            else
            {
                return;
            }
        }
        else
        {
            alert('{SelCountry}');
        }
        
    }
</script>

<div class="padl0">
    {submenu}    
    <!-- Search -->
    <form id="frmSearch" method="get">
    <div id="search_cont">
        <table cellspacing="0" cellpadding="3" border="0">
            <tr>
                <td>
                    {SearchBy} {Name} &nbsp;
                    <input type="text" id="query" name="query" size="13" value="{query}" />
                </td>                
                <td >

                        onclick="LoadData(1);" />
                </td>
            </tr>
        </table>
    </div>
    <input type="hidden" id="timer" name="timer" value="{timer-val}" />
    <input type="hidden" id="page" name="page" value="{page}" />

                </td>
                <td class="l">
                    {Icon-val}
                </td>
                <td class="c">
                    {DisplayOrder-val}
                </td>
                <td class="c">
                    <div style="margin: auto" class="c {IsEnabled-class}"/>
                </td>
                <td class="c">
                    <span class="icedit" onclick="DoCal('CountryUpdate.aspx?id={ID-val}','Update country', 630, 400);" ></span>

            <!--/Content-->
        </tbody>
    </table>
    {paging-bottom}

        <a class="abutton" href="javascript:;" onclick="javascript:deleteCountries();"><span>{Delete}</span></a>
        <a class="abutton" href="javascript:;" onclick="javascript:DoCal('CountryUpdate.aspx','Add country', 630, 400)"><span>{Add}</span></a>

</div>
