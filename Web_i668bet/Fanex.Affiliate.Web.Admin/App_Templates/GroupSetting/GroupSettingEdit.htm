<script type="text/javascript">    
   var ProductStatusColor = {ProductStatusColor_val};
    var IconProductStatus={IconProductStatus_val};
    var ProductTabSwitchIcon={ProductTabSwitchIcon_val};
    var ProductTabSwitch={ProductTabSwitch_val};
    var CheckboxStatus={CheckboxStatus_val};
    var IconEdit={IconEdit_val};
    var IconDelete={IconDelete_val};
    var IconAddTier={IconAddTier_val};
    var IconSave={IconSave_val};   
    var GroupSetting={GroupSetting_val};  
    
    var EnableProductExplainTpl='{EnableProductExplainTpl_val}';
    var DisableProductExplainTpl='{DisableProductExplainTpl_val}';
    var TierRowTpl={TierRowTpl_val};    
    var maximumQMNumber={maximumQMNumber_val};
    var maximumAmountNumber={maximumAmountNumber_val};
    var noInfo='{noInfo_val}';
    
   function HandCursor(e){
       e.className +=" hand";
   } 
   
   function NormalCursor(e){
         e.className = ProductStatusColor.Enabled;
   }

   var Msg = {
    GroupNameEmpty: "{GroupNameEmpty}",
    ValidQualifiedAmount: "{ValidQualifiedAmount}",
    EnableProduct: "{EnableProduct}",
    ConfirmUpdateGroup: "{ConfirmUpdateGroup}",
    InvalidSettingFor: "{InvalidSettingFor}",
    MaxTierAllow: "{MaxTierAllow}",
    LastTierSettingHaveMaxValue: "{LastTierSettingHaveMaxValue}",
    TierSettingAtLeastTier: "{TierSettingAtLeastTier}",
    ConfirmRemoveFromGroup: "{ConfirmRemoveFromGroup}"
   };   
</script>
<div class="container">  
<!--NormalGroup-->
 <div class="form_row">
  <label style="float:left;width:100px">{GroupName}:</label><input type="text" style="width:150px;" id="txtGroupName" name="txtGroupName" value="{GroupName_val}" maxlength="{maxlengthGroupName_val}" {txtGroupName_disabled_val}/> <span class="required" title="{RequiedExplain_val}">&nbsp;*</span>
 </div> 
 <div class="form_row">
  <label style="float:left;width:100px">{Description}:</label><input type="text" style="width: 250px;" id="txtDescription" name="txtDescription" value="{Description_val}"  maxlength="{maxlengthDescription_val}"/>
 </div>
 <!--/NormalGroup-->
  <div class="form_row">
  <label style="float:left;width:100px">{QualifiedAmount}:</label><input type="text" style="width:150px;" id="qualifiedAmount" name="qualifiedAmount" value="{qualifiedAmount-val}" maxlength="20" value="0"/> <span class="required" title="{RequiedExplain_val}">&nbsp;*</span>
 </div> 
  <div class="form_row">
  <label style="float:left;width:100px">{Currency}:</label>{currencies}  
 </div>
 
 <div class="form_row">
   <label style="float:left;width:100px">{ActiveAll}:</label><div id="chkAll" class="{chkActiveAllClass_val}">&nbsp;</div>
 </div>
 <div class="form_row">
   <span style="color: red;font-weight: normal">{InputCurrencyValue}</span>
 </div>
  <!--CurrencyNotifications-->
 <div class="red" id="currNotify" style="display:none;margin: 5px 5px 15px 25px">
    {CurrencyNotifications}
 </div>
 <!--/CurrencyNotifications-->
 <!--ProductSetting-->
 <div id="tab_header{ProductID_val}" class="tab_header">
    <div class="tab_title">                   
			<ul>
				<li id="collapse_expand{ProductID_val}" class="{collapse_expand_val}">				
				 <span>
				   <span id="product_color{ProductID_val}" class="{product_color_val}" onmouseover="HandCursor(this)" onmouseout="NormalCursor(this)"> 
				      <div id="icon_enable{ProductID_val}" class="{icon_enable_val}" title="{icon_enable_explain_val}">&nbsp;</div>			      
				      {ProductName}
				   </span>
				  </span>
				 </li>
			</ul>			
	        <div class="textcopy">
                 <div id="chkCopy{ProductID_val}" class="{chkbox_copy_val}">&nbsp;</div>
                  {CopyAllText}
            </div>
    </div>    
    
 </div>
        
 <div id="tab_content{ProductID_val}" style="display:{tab_content_display_val};" class="tab_content">
   <!--Deduction-->
    <div class="fieldset">
        <div class="legend">{Deductions}</div>
        <div class="clear"></div>
        <!--DeductionOption-->
         <div id="deduction_{ProductID_val}_{DeductionID_val}" class="{chkActiveDeductionClass_val}" title="{DeductionDescription_val}">&nbsp;</div> {DeductionName_val} &nbsp;&nbsp;&nbsp;&nbsp;
        <!--/DeductionOption-->          
    </div>            
    <!--/Deduction-->         
    <div class="fieldset">
        <div class="legend">{TierSetting}</div><br/>
        <table cellspacing="1" cellpadding="0" border="0" bgcolor="#90b3ce" width="100%" id="tblTier{ProductID_val}">
          <tr>
            <td width="55" class="header">{Tier}</td>
            <td width="100" class="header" title="{MinAmountExplain}">{MinAmount}</td>
            <td width="160" class="header" title="{MaxAmountExplain}">{MaxAmount}</td>
            <td width="100" class="header" title="{MinQMExplain}">{MinQM}</td>
            <td width="160" class="header" title="{MaxQMExplain}">{MaxQM}</td>
            <td width="80" class="header">{Comm}</td>
            <td width="80" class="header">{Action}</td>
            </tr>
          <tbody id="tierList{ProductID_val}">
             <!--TierRow-->
          <tr id="tier_{ProductID_val}_{tierID_val}">          
            <td id="tierCol_{ProductID_val}_{tierID_val}">{tierID_val}</td>
            <td><input type="text" id="txtMinAmount_{ProductID_val}_{tierID_val}" name="txtMinAmount_{ProductID_val}_{tierID_val}" value="{txtMinAmount_val}" maxlength="{maxlengthAmount_val}" {disabled_txtMinAmount_val}/></td>
            <td class="for_form">
              <input type="text" id="txtMaxAmount_{ProductID_val}_{tierID_val}" name="txtMaxAmount_{ProductID_val}_{tierID_val}"  value="{txtMaxAmount_val}"  maxlength="{maxlengthAmount_val}" {disabled_txtMaxAmount_val}/>
               <div id="chkMaxAmount_{ProductID_val}_{tierID_val}" class="{chkMaxClass_val}">&nbsp;</div>∞
            </td>
            <td>
              <input type="text" id="txtMinQM_{ProductID_val}_{tierID_val}" name="txtMinQM_{ProductID_val}_{tierID_val}"  value="{txtMinQM_val}"  maxlength="{maxlengthQM_val}"  {disabled_txtMinQM_val}/>
             </td>
            <td class="for_form">
               <input type="text" id="txtMaxQM_{ProductID_val}_{tierID_val}" name="txtMaxQM_{ProductID_val}_{tierID_val}"  value="{txtMaxQM_val}"  maxlength="{maxlengthQM_val}" {disabled_txtMaxQM_val}/>
               <div id="chkMaxQM_{ProductID_val}_{tierID_val}" class="{chkMaxClass_val}">&nbsp;</div>∞
             </td>
            <td><select style="width:100%;" id="slCommission_{ProductID_val}_{tierID_val}" name="slCommission_{ProductID_val}_{tierID_val}"  value="{Commission_val}">
              <!--SelectOption--><option value="{option_value}" {selected_val}>{option_value}</option> <!--/SelectOption-->              
            </select></td>            
            <td>              
              <span class="{icon_delete_status_val}" title="{Delete}" id="btnDelete_{ProductID_val}_{tierID_val}">&nbsp;</span>
            </td>
            
            </tr>
             <!--/TierRow-->          
        </tbody>
        </table>
         <div class="{btnAddStatus_val}" id="btnAddTier{ProductID_val}">{AddTier}</div>
        </div>
      </div>
  <!--/ProductSetting-->
 <div class="clear" style="height:10px;"></div>
 <div class="btnSave" id="btnSave">{Submit}</div>
 <input type=hidden id="everin" name="everin" value="false" />
 </div>
