<script type="text/javascript">
    var ctrInput = "{ServerDateTime}";
    var minNo = {minNo};
    var maxNo = {maxNo};
    var curMsgID=-1;
    window.onload = Init;
    var addEditTpl;
    var listChk;
    function Init() {   
        listChk = $$("div .chk");
        for(var i = 0; i < listChk.length; i++)
        {
            listChk[i].observe('click', chkOnclick);
        }
        
        EnableDisableSearchDate($("chkDate"));
        if($("hdchkDate").value =="on"){
            $("chkDate").className = "chk ic-check";
        }
        else{
            $("chkDate").className = "chk ic-uncheck";
        }
        
        $("slTime").value = $("timer").value;
        if ($("slTime").value != "0") {
            time = parseInt($("slTime").value);
            setInterval("CountDown();", 1000);
        }  
        /*Initialize controls state*/
        var selectedIndex = parseInt($("hdSearchOption").value);
        $("slSearchOption").options[selectedIndex + 1].selected = true;
        
        if($("hdchkDate").value=="on"){
            $("chkDate").checked = true;
            EnableDisableSearchDate($("chkDate"));
        }
        else
            $("chkDate").checked = false;
            
        $("fdate").value = $("hdfDate").value;
        $("tdate").value = $("hdtDate").value;
        
        if($("hdTotalMess").value =="0")
        {
            $("btnDelBottom").style.display = "none";
            $("btnCurMessBottom").style.display = "none";
        }
        else
            $("slPageSize").value = $("pagesize").value;     
    }
    function chkOnclick(event)
    {
        var element = Event.element(event);
        if(element.hasClassName("ic-check"))
            element.className = "chk ic-uncheck";
        else
            element.className = "chk ic-check";
            
        if (element.id.toString() == "chkDate") {
            /*Enable search by date */
            if (element.hasClassName("ic-check")) {
                $("hdchkDate").value = "on";
                $("fdate").disabled = false;
                $("tdate").disabled = false;
                $("fdateTrigger").disabled = false;
                $("tdateTrigger").disabled = false;

                Calendar.setup({
                    inputField: "fdate",
                    ifFormat: "%m/%d/%Y",
                    button: "fdateTrigger",
                    singleClick: true,
                    showsTime: false,
                    showOthers : true,
                    step : 1
                });

                Calendar.setup({
                    inputField: "tdate",
                    ifFormat: "%m/%d/%Y",
                    button: "tdateTrigger",
                    singleClick: true,
                    showsTime: false,
                    showOthers : true,
                    step : 1
                });

            }
            else {/*Disable search by date */
                $("hdchkDate").value = "";
                $("fdate").disabled = true;
                $("tdate").disabled = true;
                $("fdateTrigger").disabled = true;
                $("tdateTrigger").disabled = true;
                $("fdateTrigger").onclick = "";
                $("tdateTrigger").onclick = "";
            }
        }
        
        for(var i = 0; i < listChk.length; i ++)
            if(listChk[i].hasClassName("ic-check"))
                $("spDelete").disabled = false;
       
    }
    
    function checkAll(isCheckAll) {
        listChk = $$("div .chk");
        var i = 0;
        if (isCheckAll)
            for (i = 0; i < listChk.length; i++) {
                if (listChk[i].id != "chkDate")
                    listChk[i].className = "chk ic-check";
            }
        else
            for (i = 0; i < listChk.length; i++) {
                if (listChk[i].id != "chkDate")
                    listChk[i].className = "chk ic-uncheck";
            }
    }
    
    function EnableDisableSearchDate(chkbox) {
        /*Enable search by date */
        if (chkbox.checked) {
            
            $("fdate").disabled = false;
            $("tdate").disabled = false;
            $("fdateTrigger").disabled = false;
            $("tdateTrigger").disabled = false;

            Calendar.setup({
                inputField: "fdate",
                ifFormat: "%m/%d/%Y",
                button: "fdateTrigger",
                singleClick: true,
                showsTime: false,
                showOthers : true,
                step : 1
            });

            Calendar.setup({
                inputField: "tdate",
                ifFormat: "%m/%d/%Y",
                button: "tdateTrigger",
                singleClick: true,
                showsTime: false,
                showOthers : true,
                step : 1
            });
       
        }
        else {/*Disable search by date */
            $("fdate").disabled = true;
            $("tdate").disabled = true;
            $("fdateTrigger").disabled = true;
            $("tdateTrigger").disabled = true;
            $("fdateTrigger").onclick = "";
            $("tdateTrigger").onclick = "";            
        }

    }
    function IsDate(str) {
      try{
         var myDate = new Date(dateString);
         return true;
      }catch(e)
      {
         return false;
      }
    }
    function FixValidDate(obj) {
        if (!IsDate(obj.value)) {
            obj.value = ctrInput;
        }
    }
    function NavigatePage(curPage) {
        LoadMessageListData(curPage);
    }
    function LoadMessageListData(curPage) {
        try {
            var page = parseInt(curPage);
         
            var params, important, fromdate, todate;
            important = $("slSearchOption").value;
            fromdate = "";
            todate = "";

            if ($("chkDate").checked) {
                fromdate = $("fdate").value;
                todate = $("tdate").value; 
            }
            
            params = "params=" + important + ";" + fromdate + ";" + todate + ";" + curPage;
        
            var ajax = new Ajax.Request("../Handler/GetMessageList.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function(data) {
                    ProcessResult(data.responseText);
                }
            });
        }
        catch (e) {
            alert(e);
        }
       

    }
    function ProcessResult(data) {
        try {
            var arr=data.split("$$$");
            minNo=parseInt(arr[0]);
            maxNo=parseInt(arr[1]);
            var sXmlBody = "<table><tbody id='result'>" + arr[2] + "</tbody></table>";
            var tempDiv = document.createElement("DIV");
            tempDiv.innerHTML = sXmlBody;
            $("tblResult").removeChild($("result"));
            $("tblResult").appendChild(tempDiv.firstChild.firstChild);
            /*$("chkAll").checked=false;*/
            if(maxNo==0){
                $("btnDelBottom").style.display="none";
            }
            else{
                $("btnDelBottom").style.display="";
            }
            $("btnDelBottom").disabled=true;
            Init();/*Initialize the state of all controls*/
        }
        catch (e) {
            alert(e);
        }
    }
    function View(msgid){
         try {
            var params;
            params = "params=" + msgid;
            var ajax = new Ajax.Request("../Handler/GetMessage.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function(data) {
                    ProcessResultView(data.responseText);
                }
            });

        }
        catch (e) {
            alert(e);
        }
    }
    function HandlePopup(){
        ClosePopup();        
        if(typeof(addEditTpl)=='undefined'){                           
            addEditTpl=$("msgInfo").innerHTML;
            $("msgInfo").innerHTML="";
        }            
        ShowPopup(addEditTpl, '', 570, 410, 70, 50);
    }
    function ProcessResultView(data){
         try {
            if(data==""){
                alert("{DataChanged}");
                return;
            }
            var arr=data.split("$$$");
           HandlePopup();
           if(arr[0]=="true"){
                $("chkImportant").checked= true;
            }
            else
            {
                $("chkImportant").checked= false;
            }             
            $("txtMessageEn").value=arr[1];
            $("txtMessageCn").value=arr[2];
            $("txtMessageTw").value=arr[3];
            $("txtMessageTh").value=arr[4];            
            $("txtMessageEs").value=arr[5];            
            $("msgID").innerHTML="&nbsp;({ID}=" + arr[6] + ")";
            curMsgID=parseInt(arr[6]);
            SetViewMode();
        }
        catch (e) {
            alert(data);
        }
    }
    function SetViewMode(){       
        $("chkImportant").disabled =true;
        $("txtMessageEn").readOnly=true;
        $("txtMessageCn").readOnly=true;
        $("txtMessageTw").readOnly=true;
        $("txtMessageTh").readOnly=true;   
        $("txtMessageEs").readOnly=true;   
        $("btnAdd").style.display="none";   
        $("btnUpdate").style.display="none";     
        $("btnEdit").style.display=""; 
        $("btnDeleteCur").style.display="";            
             
    }
    function SetEditMode(){       
        $("chkImportant").disabled =false;
        $("txtMessageEn").readOnly=false;
        $("txtMessageCn").readOnly=false;
        $("txtMessageTw").readOnly=false;
        $("txtMessageTh").readOnly=false;   
        $("txtMessageEs").readOnly=false;   
        $("btnEdit").style.display="none";   
        $("btnAdd").style.display="none"; 
        $("btnUpdate").style.display=""; 
        $("btnDeleteCur").style.display="";            
    }
    
    function DeleteSelectedMessage(){
        var listChk = $$("div .chk");
        var messageChecked = false;
        var j=0;
        for(j=0;j<listChk.length;j++)
        {
            if(listChk[j].hasClassName("ic-check") && listChk[j].id != "chkDate"){
                messageChecked = true;
                break;
            }
        }
        if(!messageChecked)
        {
            alert("{NoMessSelected}");
            return;
        }
        else{  
            if(confirm("{ConfirmDeleteMessage}")){
                var params="";
                var i = 0;
                var listAffID = "";
                for(i = 0; i < listChk.length; i++)
                {
                    if(listChk[i].hasClassName("ic-check") && listChk[i].id != "chkDate")
                        listAffID += listChk[i].id + ",";
                }
                params = listAffID;
                DeleteMessage(params);
                
            }
        }
    }
    function DeleteMessage(msgList){
         try {
            var params;
            params = "params=" + msgList;
            var ajax = new Ajax.Request("../Handler/DeleteMessageList.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function(data) {
                    if(data.responseText!=""){
                        alert(data.responseText);
                    }
                    else
                    {
                        LoadData(1);                         
                    }
                     ClosePopup(); 
                }
            });
        }
        catch (e) {
            alert(e);
        }
    }
    function DeleteCurrentMessage(){
        if(confirm("{ConfirmDeleteMessage}")){
            DeleteMessage(curMsgID + ",");           
        }
    }
    function AddNewMessage(){
        try {
            var params;        
            if(($("txtMessageEn").value=="") && ($("txtMessageCn").value=="") && ($("txtMessageTw").value=="") && ($("txtMessageTh").value=="") && ($("txtMessageEs").value=="")){
                    confirm("{AddEmptyMessError}");
                    return;
                }
            params = "params=";
            params+= encodeURIComponent($("chkImportant").checked) + "$$$";
            params += encodeURIComponent($("txtMessageEn").value) + "$$$";
            params += encodeURIComponent($("txtMessageCn").value) + "$$$";
            params+= encodeURIComponent($("txtMessageTw").value) + "$$$";
            params+= encodeURIComponent($("txtMessageTh").value) + "$$$";
            params+= encodeURIComponent($("txtMessageEs").value);
           
            var ajax = new Ajax.Request("../Handler/AddMessage.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function(data) {                   
                    if(data.responseText!=""){
                        alert(data.responseText);
                    }
                    else
                    {
                        LoadMessageListData(1);                                          
                    }
                    ClosePopup();    
                }
            });

        }
        catch (e) {
            alert(e);
        } 
    }
</script>

<div class="padl0">
    {submenu}
    <!-- Search -->
    <form id="frmSearch" method="get">
    <div id="search_cont">
        <table cellspacing="0" cellpadding="3" border="0" width="100%">
            <tr>
                <td width="150">
                    {SearchBy} &nbsp;
                    <select id="slSearchOption" name="slSearchOption">
                        <option selected="selected" value="-1">{All}</option>
                        <option value="0">{Normal}</option>
                        <option value="1">{Important}</option>
                    </select>
                </td>
                <td class="r" width="20">
                    <div id="chkDate" class="chk ic-uncheck"></div>
                </td>
                <td class="r" width="36">
                    {From}&nbsp;&nbsp;
                </td>
                <td class="r" width="76">
                    <input type="text" id="fdate" name="fdate" size="13" value="{ServerDateTime}" disabled="disabled"
                        onblur="FixValidDate(this);" />
                </td>
                <td width="38">
                    <img hspace="3" height="16" border="0" width="16" src="../{themepath}/images/cal.gif"
                        id="fdateTrigger" disabled="disabled" class="img-date-selector hand" />
                </td>
                <td width="19">
                    {To}
                </td>
                <td width="75">
                    <input type="text" id="tdate" name="tdate" size="13" value="{ServerDateTime}" disabled="disabled"
                        onblur="FixValidDate(this);" />
                </td>
                <td width="29">
                    <img hspace="3" height="16" border="0" width="16" src="../{themepath}/images/cal.gif"
                        id="tdateTrigger" disabled="disabled" class="img-date-selector hand" />
                </td>
                <td width="57">
                    <input type="submit" value="{Submit}" id="btnSubmit" name="{Submit}" class="buttonlogin"
                        onclick="LoadData(1);" />
                </td>
                <td class="r">
                    <span id="spTime" style="vertical-align: middle; padding: 3px 10px 0 0;"></span>
                    <span id="icontime" onclick="showRefreshTime(true);" align="right">&nbsp;</span>
                    <span style="display: none;" id="divTime" align="right">
                        <select id="slTime" name="slTime" onchange="UpdateTime();" onblur="hideRefreshTime(false);">
                            <option value="0">Never</option>
                            <option value="300">5 mins</option>
                            <option value="900">15 mins</option>
                            <option value="1800">30 mins</option>
                            <option value="3600">60 mins</option>
                        </select>
                    </span>
                </td>
            </tr>
        </table>
        <input type="hidden" id="page" name="page" value="{page}" />
        <input type="hidden" id="pagesize" name="pagesize" value="{pagesize}" />
        <input type="hidden" id="hdSearchOption" name="hdSearchOption" value="{hdSearchOption-val}" />
        <input type="hidden" id="hdchkDate" name="hdchkDate" value="{hdchkDate-val}" />
        <input type="hidden" id="hdfDate" name="hdfDate" value="{hdfDate-val}" />
        <input type="hidden" id="hdtDate" name="hdtDate" value="{hdtDate-val}" />
        <input type="hidden" id="hdTotalMess" name="hdTotalMess" value="{hdTotalMess-val}" />
    </div>
    <input type="hidden" id="timer" name="timer" value="{timer-val}" />
    </form>
    <!-- /Search -->
    {paging-top}
    <table class="aff-table" cellspacing="1" cellpadding="3" width="1100px" id="tblResult">
        <tr>
            <th style="width:16px;">&nbsp;</th>
            <th style="width:20px;">&nbsp;</th>
            <th style="width:100px;">
                {Creator}
            </th >
            <th style="width:110px;">
                {PostDate}
            </th>
            <th>
                {Message}
            </th>
            <th style="width:35px;">
                {Important}
            </th>
            <th style="width:100px;">
                {UpdatedBy}
            </th>
            <th style="width:110px;">
                {UpdateDate}
            </th>
        </tr>
        <tbody id="result">
            <!--Content-->
            <tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td class="c">
                    <div id="{ID-val}" class="chk ic-uncheck"/>
                </td>
                <td class="c">
                    {No-val}
                </td>
                <td class="c">
                    {Creator-val}
                </td>
                <td class="c">
                    {Postdate-val}
                </td>
                <td class="l {hotnewsstyle}" onclick="DoCal('ViewMessDetails.aspx?id={ID-val}','Message Detail (ID={ID-val})', 600, 500)" title="{ViewDetail}">
                    {Message-val}
                </td>
                <td class="c">
                    {Important-val}
                </td>
                <td class="c">
                    {UpdatedBy-val}
                </td>
                <td class="c">
                    {UpdateDate-val}
                </td>
            </tr>
            <!--/Content-->
        </tbody>
    </table>
    {paging-bottom}
    <div style="margin-top:5px; height:20px;">
        <a class="abutton" style="margin-right:4px;" id="btnDelBottom" href="javascript:DeleteSelectedMessage();">
            <span id="spDelete">{Delete}</span>
        </a>
        <a class="abutton"  style="margin-right:4px;" id="btnAddBottom" href="javascript:DoCal('ViewMessDetails.aspx?id=', 'Add new message', 600, 500);">
            <span id="Span1">{Add}</span>
        </a>
        <a class="abutton"  style="margin-right:4px;" id="btnCurMessBottom" href="javascript:DoCal('ViewMessDetails.aspx?id=-1','Current Message Detail', 600, 500)">
            <span id="Span2">{CurrentMessage}</span>
        </a>
    </div>    
</div>
