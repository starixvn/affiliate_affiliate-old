<div class="padl0">  
    <div id="errMsg" style="display: none; width: 264px; margin: 3px 0;">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    <div class="pcontent">
        <table cellspacing="5" cellpadding="0" width="100%">
            <tr>
                <td>
                    {Subject}:
                </td>
                <td id="tdSubject" style="font-weight: bold;">
                    {Subject-val}
                </td>
            </tr>
            <tr>
                <td>
                    {From}:
                </td>
                <td id="tdFrom">
                    {Sender-val}&nbsp;(<a href="javascript:openMailLink('mailto:{Email-val}')">{Email-val}</a>)
                </td>
            </tr>
            <tr>
                <td>
                    {SentDate}:
                </td>
                <td id="tdSentDate">
                    {Sent-val}
                </td>
            </tr>
            <tr>
                <td>
                    {Content}:
                </td>
                <td align="left">
                    <textarea style="width: 300px; height: 128px;" id="txtContent" readonly="readonly">{Content-val}</textarea>
                </td>
            </tr>
            <tr>
                <td>
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div class="l" style="margin-top: 3px; margin-left: 3px;">
        <input type="button" class="buttonlogin" id="btnDeleteCur" value="{Delete}" onclick="DeleteCurrentMessage();" />
        &nbsp;
        <input type="button" id="btnClose" class="buttonlogin" value="{Cancel}" onclick="javascript:parent.ibcWnd.close();" />
    </div>
    <input id="mid" name="mid" type="hidden" value="{mid}" />
    <input id="ConfirmDeleteEmail" name="ConfirmDeleteEmail" type="hidden" value="{ConfirmDeleteEmail}" />   

</div>
