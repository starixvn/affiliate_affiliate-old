<script type="text/javascript">

    function ViewStatisticsAll() {

        try {
            var params;
            params = "params=" + $("slTrackingCode").value;

            var ajax = new Ajax.Request("../Handler/GetClickStatisticsList.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function (data) {
                    ProcessResult(data.responseText);
                }
            });

        }
        catch (e) {
            alert(e);
        }


    }
    function ProcessResult(data) {
        try {

            var sXmlBody = "<table><tbody id='result'>" + data + "</tbody></table>";
            var tempDiv = document.createElement("DIV");
            tempDiv.innerHTML = sXmlBody;
            $("tblResult").removeChild($("result"));
            $("tblResult").appendChild(tempDiv.firstChild.firstChild);
            $("statisticsDetail").style.display = "none";

        }
        catch (e) {
            alert(e);
        }
    }
    function ViewStatisticsDetail(month) {
        try {
            var params;
            params = "params=" + $("slTrackingCode").value + ";" + month;

            var ajax = new Ajax.Request("../Handler/GetStatisticsListDetail.ashx", {
                method: 'post',
                parameters: params,
                onComplete: function (data) {
                    ProcessResultDetail(data.responseText);
                }
            });

        }
        catch (e) {
            alert(e);
        }
    }
    function ProcessResultDetail(data) {
        try {

            var sXmlBody = "<table><tbody id='resultDetail'>" + data + "</tbody></table>";
            var tempDiv = document.createElement("DIV");
            tempDiv.innerHTML = sXmlBody;
            $("tblResultDetail").removeChild($("resultDetail"));
            $("tblResultDetail").appendChild(tempDiv.firstChild.firstChild);
            $("statisticsDetail").style.display = "";
        }
        catch (e) {
            alert(e);
        }
    }
</script>
<div id="contents">
    <div id="box_insite">
        <div class="header_in">
            <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                    <td class="in_top" width="190">
                        {TrackingStatistics}
                    </td>
                    <td class="in_right">
                        &nbsp;
                    </td>
                </tr>
            </table>
        </div>
        <div class="in_conts">
            <div id="search_cont" style="height: 25px;">
                <div id="header_search">
                    <table cellspacing="0" cellpadding="0" border="0">
                        <tr>
                            <td style="padding-left: 15px;">
                                {TrackingCode}: &nbsp; {slTrackingCode}
                            </td>
                            <td style="padding-left: 25px;">
                                <input type="button" value="{Submit}" id="btnSubmit" name="{Submit}" class="button"
                                    onclick="ViewStatisticsAll();" />
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            <div style="height: 5px;">
                &nbsp;</div>
            <div class="tbl-box">
                <table id="tblResult" class="aff-table" cellspacing="1" cellpadding="1">
                    <tr class="tblheader">
                        <td width="10%">
                            &nbsp;
                        </td>
                        <td width="30%">
                            {Month}
                        </td>
                        <td width="30%">
                            {TotalClick}
                        </td>
                        <td width="30%">
                            {UniqueClick}
                        </td>
                    </tr>
                    <tbody id="result">
                        <!--Content-->
                        <tr class="{rowstyle} c" onmouseout="this.className={onmouseoutstyle};" onmouseover="this.className=c;">
                            <td class="c">
                                {No-val}
                            </td>
                            <td class="c fu">
                                <a href="javascript:void(0);" onclick="ViewStatisticsDetail('{MonthFull-val}');">{Month-val}</a>
                            </td>
                            <td class="c">
                                {TotalClick-val}
                            </td>
                            <td class="c">
                                {UniqueClick-val}
                            </td>
                        </tr>
                        <!--/Content-->
                    </tbody>
                </table>
            </div>
            <br />
            <div id="statisticsDetail" class="tbl-box" style="display: none;">
                <!--StatisticsDetail-->
                <table id="tblResultDetail" class="aff-table" cellspacing="1" cellpadding="1">
                    <tr class="tblheader">
                        <td width="10%">
                            &nbsp;
                        </td>
                        <td width="30%">
                            {Date}
                        </td>
                        <td width="30%">
                            {TotalClick}
                        </td>
                        <td width="30%">
                            {UniqueClick}
                        </td>
                    </tr>
                    <tbody id="resultDetail">
                        <!--StatisticsDetailContent-->
                        <tr class="{rowstyle} c" onmouseout="this.className={onmouseoutstyle};" onmouseover="this.className=c;">
                            <td class="c">
                                {No-val}
                            </td>
                            <td class="c fu">
                                {Date-val}
                            </td>
                            <td class="c">
                                {TotalClick-val}
                            </td>
                            <td class="c">
                                {UniqueClick-val}
                            </td>
                        </tr>
                        <!--/StatisticsDetailContent-->
                    </tbody>
                </table>
                <!--/StatisticsDetail-->
            </div>
        </div>
    </div>
</div>
